plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gimi.launcher'
    compileSdk 36

    defaultConfig {
        applicationId "com.gimi.launcher"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation files('../../build/shizuku_api/classes.jar')
    implementation files('../../build/shizuku_provider/classes.jar')
}
